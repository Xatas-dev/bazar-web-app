apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: roles
  rules:
    - actions: [ READ ]
      effect: EFFECT_ALLOW
      roles: [ user ]
      condition:
        match:
          any:
            of:
              - expr: has(P.attr.is_creator) && P.attr.is_creator == true
              - expr: >
                  has(P.attr.allowed_actions) && (
                    'roles:READ' in P.attr.allowed_actions || 
                    (has(P.attr.role_id) && P.attr.role_id == int(R.id)))

    - actions: [ ASSIGN ]
      effect: EFFECT_ALLOW
      roles: [ user ]
      condition:
        match:
          any:
            of:
              - expr: has(P.attr.is_creator) && P.attr.is_creator == true
              - expr: >
                  has(P.attr.allowed_actions) &&
                  'roles:ASSIGN' in P.attr.allowed_actions
    - actions: [ MANAGE ]
      effect: EFFECT_DENY
      roles: [ user ]
      condition:
        match:
          expr: has(R.attr.scope) && R.attr.scope == "GLOBAL"

    - actions: [ MANAGE ]
      effect: EFFECT_ALLOW
      roles: [ user ]
      condition:
        match:
          any:
            of:
              - expr: has(P.attr.is_creator) && P.attr.is_creator == true
              - expr: >
                  has(P.attr.allowed_actions) &&
                  'roles:MANAGE' in P.attr.allowed_actions &&
                  (
                    !has(P.attr.actions_to_grant) ||
                    P.attr.actions_to_grant.isSubset(P.attr.allowed_actions)
                  )