apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: nodes
  rules:
    - actions: [UPLOAD]
      effect: EFFECT_ALLOW
      roles: [user]
      condition:
        match:
          any:
            of:
              - expr: has(P.attr.is_creator) && P.attr.is_creator == true
              - expr: has(P.attr.allowed_actions) && 'nodes:UPLOAD' in P.attr.allowed_actions

    - actions: [DOWNLOAD]
      effect: EFFECT_ALLOW
      roles: [ user ]
      condition:
        match:
          any:
            of:
              - expr: has(P.attr.is_creator) && P.attr.is_creator == true
              - expr: has(P.attr.allowed_actions) && 'nodes:DOWNLOAD' in P.attr.allowed_actions

    - actions: [DELETE]
      effect: EFFECT_ALLOW
      roles: [user]
      condition:
        match:
          any:
            of:
              - expr: has(P.attr.is_creator) && P.attr.is_creator == true
              - expr: has(P.attr.allowed_actions) && 'nodes:DELETE' in P.attr.allowed_actions
