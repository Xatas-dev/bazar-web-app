version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./bazar-realm.json:/opt/keycloak/data/import/bazar-realm-realm.json:ro
    ports:
      - "9999:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/8080" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - app-network

  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    container_name: cerbos
    volumes:
      - ./space-policy.yaml:/policies/space-policy.yaml
    command: server --set=storage.driver=disk --set=storage.disk.directory=/policies
    networks:
      - app-network

  bazar-api-gateway:
    image: basegod/bazar-api-gateway:latest
    container_name: bazar-api-gateway
    environment:
      - KC_URL=http://host.docker.internal:9999
      - KC_REALM=bazar-realm
      - CLIENT_ID=bazar-api-gateway
      - CLIENT_SECRET=secret
      - BAZAR_SPACE_URL=http://bazar-space:8080
      - BAZAR_PERSONA_URL=http://bazar-persona:8080
      - BAZAR_CHAT_URL=http://bazar-chat:8080
      - BAZAR_CHAT_WS_URL=ws://bazar-chat:8080
      - FRONTEND_URL=http://localhost:5173
      - OAUTH_REDIRECT_URI=http://localhost:8080/login/oauth2/code/keycloak
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      cerbos:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped

  bazar-authorization:
    image: basegod/bazar-authorization:latest
    container_name: bazar-authorization
    environment:
      - DB_URL=jdbc:postgresql://postgresql:5432/bzrauthz
      - DB_USER=postgres
      - DB_PASS=postgres
      - KC_URL=http://host.docker.internal:9999
      - KC_REALM=bazar-realm
      - LOGGING_LEVEL=INFO
      - CERBOS_URL=cerbos:3593
    depends_on:
      postgresql:
        condition: service_healthy
      cerbos:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped

  bazar-space:
    image: basegod/bazar-space:latest
    container_name: bazar-space
    environment:
      - DB_URL=jdbc:postgresql://postgresql:5432/bzrspace
      - DB_USER=postgres
      - DB_PASS=postgres
      - KC_URL=http://host.docker.internal:9999
      - KC_REALM=bazar-realm
      - LOGGING_LEVEL=INFO
      - BAZAR_AUTHORIZATION_GRPC_URL=static://bazar-authorization:9090
    depends_on:
      postgresql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped

  bazar-chat:
    image: basegod/bazar-chat:latest
    container_name: bazar-chat
    environment:
      - DB_URL=jdbc:postgresql://postgresql:5432/bzrchat
      - DB_USER=postgres
      - DB_PASS=postgres
      - KC_EXTERNAL_URL=http://host.docker.internal:9999
      - KC_REALM=bazar-realm
      - LOGGING_LEVEL=INFO
      - INTEGRATION_REST_BAZAR_PERSONA_API_URL=http://bazar-persona:8080/api
    depends_on:
      postgresql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped

  bazar-persona:
    image: basegod/bazar-persona:latest
    container_name: bazar-persona
    environment:
      - DB_URL=jdbc:postgresql://postgresql:5432/bzrpersona
      - DB_USER=postgres
      - DB_PASS=postgres
      - KC_URL=http://host.docker.internal:9999
      - KC_EXTERNAL_URL=http://host.docker.internal:9999
      - KC_REALM=bazar-realm
      - LOGGING_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  cerbos_policies:
  cerbos_config: